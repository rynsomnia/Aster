  <title>Aster — Starmap Cartographer</title>

</head>
<body>
  <!-- Full-screen mount -->
  <script src="aster.js"></script>
  <script>
    // Full screen:
    const app = Aster.mount();

    // Or mount into your own sized container:
    //   <div id="map" style="position:relative;width:800px;height:600px"></div>
    //   const app = Aster.mount('#map');

    // Programmatic API:

    //   app.destroy()         -> tear down and remove listeners
  </script>
